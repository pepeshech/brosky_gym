version: '3.8'

services:
  brosky-gym:
    build:
      context: .
      dockerfile: Dockerfile
    image: brosky-gym:latest
    container_name: brosky-gym-app
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
