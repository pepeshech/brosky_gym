version: '3.8'

services:
  brosky-gym:
    build:
      context: .
      dockerfile: Dockerfile
    image: brosky-gym:latest
    container_name: brosky-gym-app
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
