<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#005ecb" />
    </linearGradient>
  </defs>
  <!-- Background Squircle (iOS style icon) -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="rgba(0, 122, 255, 0.15)" stroke-width="12" />
  
  <!-- Minimal Dumbbell Icon -->
  <g transform="translate(116, 176)">
    <!-- Left Plate Outer -->
    <rect x="0" y="20" width="32" height="120" rx="12" fill="url(#accent)" />
    <!-- Left Plate Inner -->
    <rect x="44" y="40" width="24" height="80" rx="8" fill="url(#accent)" />
    
    <!-- Shaft / Bar -->
    <rect x="68" y="64" width="144" height="32" rx="4" fill="url(#accent)" />
    
    <!-- Right Plate Inner -->
    <rect x="212" y="40" width="24" height="80" rx="8" fill="url(#accent)" />
    <!-- Right Plate Outer -->
    <rect x="248" y="20" width="32" height="120" rx="12" fill="url(#accent)" />
    
    <!-- Decorative Highlight on Bar -->
    <line x1="80" y1="72" x2="200" y2="72" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
